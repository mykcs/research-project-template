name: Research CPU checks

# Manual until the maintainer confirms private CI budget and merge policy.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Verify locked project
        run: ./run.sh ci
